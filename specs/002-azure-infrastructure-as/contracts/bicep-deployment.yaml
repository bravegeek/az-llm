openapi: 3.0.3
info:
  title: Azure Infrastructure Deployment Contract
  description: |
    Bicep deployment parameter and output schema for Azure infrastructure provisioning.
    This contract defines the input parameters and expected outputs for deploying
    Azure OpenAI Service, App Service, Static Web App, and Application Insights.
  version: 1.0.0
  contact:
    name: az-llm Project

servers:
  - url: https://management.azure.com
    description: Azure Resource Manager API

paths:
  /subscriptions/{subscriptionId}/resourcegroups/{resourceGroupName}/providers/Microsoft.Resources/deployments/{deploymentName}:
    put:
      summary: Deploy Infrastructure
      description: Deploys Azure infrastructure using Bicep templates
      operationId: deployInfrastructure
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "00000000-0000-0000-0000-000000000000"
        - name: resourceGroupName
          in: path
          required: true
          schema:
            type: string
            pattern: '^rg-[a-z0-9-]{1,80}$'
          example: "rg-az-llm-dev"
        - name: deploymentName
          in: path
          required: true
          schema:
            type: string
          example: "az-llm-infra-deployment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentRequest'
            examples:
              dev:
                $ref: '#/components/examples/DevDeployment'
              staging:
                $ref: '#/components/examples/StagingDeployment'
              prod:
                $ref: '#/components/examples/ProdDeployment'
      responses:
        '200':
          description: Deployment successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
        '400':
          description: Invalid deployment parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Deployment conflict (resource already exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    DeploymentRequest:
      type: object
      required:
        - properties
      properties:
        properties:
          type: object
          required:
            - mode
            - template
            - parameters
          properties:
            mode:
              type: string
              enum: [Incremental, Complete]
              description: Deployment mode
              default: Incremental
            template:
              type: object
              description: Bicep template (compiled to ARM JSON)
            parameters:
              $ref: '#/components/schemas/DeploymentParameters'

    DeploymentParameters:
      type: object
      required:
        - environment
        - location
        - projectName
        - appServiceSku
        - openAiModels
        - tags
      properties:
        environment:
          type: object
          required:
            - value
          properties:
            value:
              type: string
              enum: [dev, staging, prod]
              description: Target environment name
              example: dev
        location:
          type: object
          required:
            - value
          properties:
            value:
              type: string
              description: Azure region for all resources
              example: eastus
              pattern: '^[a-z]+[a-z0-9]*$'
        projectName:
          type: object
          required:
            - value
          properties:
            value:
              type: string
              description: Project identifier for resource naming
              example: az-llm
              pattern: '^[a-z][a-z0-9-]{1,20}$'
        appServiceSku:
          type: object
          required:
            - value
          properties:
            value:
              type: object
              required:
                - name
                - tier
              properties:
                name:
                  type: string
                  description: SKU identifier
                  example: B1
                  enum: [F1, B1, B2, B3, S1, S2, S3, P1V2, P2V2, P3V2]
                tier:
                  type: string
                  description: SKU tier
                  example: Basic
                  enum: [Free, Basic, Standard, Premium, PremiumV2]
        openAiModels:
          type: object
          required:
            - value
          properties:
            value:
              type: array
              description: Azure OpenAI model deployments
              minItems: 3
              maxItems: 3
              items:
                $ref: '#/components/schemas/ModelDeployment'
        tags:
          type: object
          required:
            - value
          properties:
            value:
              type: object
              required:
                - Environment
                - Project
              properties:
                Environment:
                  type: string
                  description: Environment tag
                  enum: [dev, staging, prod]
                Project:
                  type: string
                  description: Project tag
                  example: az-llm

    ModelDeployment:
      type: object
      required:
        - name
        - model
        - version
        - capacity
      properties:
        name:
          type: string
          description: Deployment name
          example: gpt-4o
        model:
          type: string
          description: Model identifier
          enum: [gpt-4o, gpt-35-turbo, dall-e-3]
        version:
          type: string
          description: Model version
          example: "2024-05-13"
        capacity:
          type: integer
          description: Tokens per minute (TPM) capacity
          minimum: 1
          maximum: 100
          example: 10

    DeploymentResponse:
      type: object
      required:
        - id
        - name
        - properties
      properties:
        id:
          type: string
          description: Deployment resource ID
          example: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-az-llm-dev/providers/Microsoft.Resources/deployments/az-llm-infra"
        name:
          type: string
          description: Deployment name
          example: az-llm-infra-deployment
        properties:
          type: object
          required:
            - provisioningState
            - outputs
          properties:
            provisioningState:
              type: string
              enum: [Succeeded, Failed, Canceled]
              description: Deployment status
              example: Succeeded
            outputs:
              $ref: '#/components/schemas/DeploymentOutputs'

    DeploymentOutputs:
      type: object
      required:
        - openAiEndpoint
        - openAiResourceId
        - appServiceName
        - appServicePrincipalId
        - staticWebAppUrl
        - applicationInsightsConnectionString
        - applicationInsightsInstrumentationKey
      properties:
        openAiEndpoint:
          type: object
          required:
            - type
            - value
          properties:
            type:
              type: string
              enum: [String]
            value:
              type: string
              format: uri
              description: Azure OpenAI Service endpoint URL
              example: "https://oai-az-llm-dev.openai.azure.com/"
        openAiResourceId:
          type: object
          required:
            - type
            - value
          properties:
            type:
              type: string
              enum: [String]
            value:
              type: string
              description: Azure OpenAI Service resource ID
              example: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-az-llm-dev/providers/Microsoft.CognitiveServices/accounts/oai-az-llm-dev"
        appServiceName:
          type: object
          required:
            - type
            - value
          properties:
            type:
              type: string
              enum: [String]
            value:
              type: string
              description: App Service name
              example: "app-az-llm-dev"
        appServicePrincipalId:
          type: object
          required:
            - type
            - value
          properties:
            type:
              type: string
              enum: [String]
            value:
              type: string
              format: uuid
              description: App Service managed identity principal ID
              example: "00000000-0000-0000-0000-000000000001"
        staticWebAppUrl:
          type: object
          required:
            - type
            - value
          properties:
            type:
              type: string
              enum: [String]
            value:
              type: string
              format: uri
              description: Static Web App default hostname
              example: "https://swa-az-llm-dev.azurestaticapps.net"
        applicationInsightsConnectionString:
          type: object
          required:
            - type
            - value
          properties:
            type:
              type: string
              enum: [String]
            value:
              type: string
              description: Application Insights connection string (for app configuration)
              example: "InstrumentationKey=00000000-0000-0000-0000-000000000002;IngestionEndpoint=https://eastus-0.in.applicationinsights.azure.com/"
        applicationInsightsInstrumentationKey:
          type: object
          required:
            - type
            - value
          properties:
            type:
              type: string
              enum: [String]
            value:
              type: string
              format: uuid
              description: Application Insights instrumentation key (legacy, for compatibility)
              example: "00000000-0000-0000-0000-000000000002"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Error code
              example: InvalidTemplateDeployment
            message:
              type: string
              description: Error message
              example: "The template deployment failed because of a policy violation."
            details:
              type: array
              items:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string

  examples:
    DevDeployment:
      summary: Development environment deployment
      value:
        properties:
          mode: Incremental
          parameters:
            environment:
              value: dev
            location:
              value: eastus
            projectName:
              value: az-llm
            appServiceSku:
              value:
                name: B1
                tier: Basic
            openAiModels:
              value:
                - name: gpt-4o
                  model: gpt-4o
                  version: "2024-05-13"
                  capacity: 10
                - name: gpt-35-turbo
                  model: gpt-35-turbo
                  version: "0613"
                  capacity: 10
                - name: dall-e-3
                  model: dall-e-3
                  version: "3.0"
                  capacity: 1
            tags:
              value:
                Environment: dev
                Project: az-llm

    StagingDeployment:
      summary: Staging environment deployment
      value:
        properties:
          mode: Incremental
          parameters:
            environment:
              value: staging
            location:
              value: eastus
            projectName:
              value: az-llm
            appServiceSku:
              value:
                name: B1
                tier: Basic
            openAiModels:
              value:
                - name: gpt-4o
                  model: gpt-4o
                  version: "2024-05-13"
                  capacity: 10
                - name: gpt-35-turbo
                  model: gpt-35-turbo
                  version: "0613"
                  capacity: 10
                - name: dall-e-3
                  model: dall-e-3
                  version: "3.0"
                  capacity: 1
            tags:
              value:
                Environment: staging
                Project: az-llm

    ProdDeployment:
      summary: Production environment deployment
      value:
        properties:
          mode: Incremental
          parameters:
            environment:
              value: prod
            location:
              value: eastus
            projectName:
              value: az-llm
            appServiceSku:
              value:
                name: B1
                tier: Basic
            openAiModels:
              value:
                - name: gpt-4o
                  model: gpt-4o
                  version: "2024-05-13"
                  capacity: 10
                - name: gpt-35-turbo
                  model: gpt-35-turbo
                  version: "0613"
                  capacity: 10
                - name: dall-e-3
                  model: dall-e-3
                  version: "3.0"
                  capacity: 1
            tags:
              value:
                Environment: prod
                Project: az-llm

tags:
  - name: Deployment
    description: Infrastructure deployment operations
  - name: Validation
    description: Deployment validation and testing
