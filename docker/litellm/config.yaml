model_list:
  - model_name: DeepSeek-V3.1
    litellm_params:
      model: azure/DeepSeek-V3.1
      api_base: https://bg-llm-01.services.ai.azure.com
      api_version: "2024-05-01-preview"
      api_key: os.environ/AZURE_API_KEY
      timeout: 600

  - model_name: gpt-4.1
    litellm_params:
      model: azure/gpt-4.1
      api_base: https://bg-llm-01.cognitiveservices.azure.com
      api_version: "2025-01-01-preview"
      api_key: os.environ/AZURE_API_KEY
      timeout: 600

  - model_name: FLUX-1.1-pro
    litellm_params:
      model: azure/FLUX-1.1-pro
      api_base: https://bg-llm-01.services.ai.azure.com
      api_version: "2025-04-01-preview"
      api_key: os.environ/AZURE_API_KEY
      base_model: FLUX-1.1-pro
      timeout: 600
    model_info:
      mode: image_generation

# Disable authentication for local development
# This allows Open WebUI to connect without requiring API key validation
litellm_settings:
  drop_params: true  # Drop unsupported params instead of erroring
  success_callback: []
  failure_callback: []

# Disable authentication - no API key required from clients
general_settings:
  disable_auth: true
